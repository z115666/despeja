# Integración continua (SDLC): pruebas, SAST y auditoría de dependencias en cada push;
# compilación en Windows y publicación con hashes cuando sube la versión (despeja/__init__.py).
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read            # mínimo privilegio para el token del flujo

jobs:
  verificar:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Dependencias
        run: python -m pip install -r requirements-dev.txt
      - name: Pruebas unitarias
        run: python -m pytest -v tests
      - name: SAST (bandit, severidad media o alta)
        run: python -m bandit -r despeja app.py -ll
      - name: Vulnerabilidades en dependencias (pip-audit)
        run: python -m pip_audit -r requirements.txt

  version:
    # Publicación automática: si la versión de despeja/__init__.py aún no tiene release, se publica
    needs: verificar
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      nueva: ${{ steps.v.outputs.nueva }}
    steps:
      - uses: actions/checkout@v5
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(python3 -c "import re;print(re.search(r'VERSION = \"(.+?)\"', open('despeja/__init__.py').read()).group(1))")
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if gh release view "v$V" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "nueva=false" >> "$GITHUB_OUTPUT"; echo "v$V ya está publicada"
          else
            echo "nueva=true" >> "$GITHUB_OUTPUT"; echo "Se publicará v$V"
          fi

  compilar:
    needs: version
    if: needs.version.outputs.nueva == 'true' || startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write       # solo este trabajo puede crear la etiqueta y la publicación
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Dependencias
        run: python -m pip install -r requirements-dev.txt
      - name: PyInstaller
        run: >
          python -m PyInstaller --noconfirm --clean --windowed --name Despeja --icon icono.ico
          --version-file version_info.txt
          --add-data "ui\index.html;ui" --add-data "ui\app.css;ui" --add-data "ui\app.js;ui"
          --add-data "ui\iconos.js;ui" --add-data "ui\fonts;ui\fonts"
          --exclude-module tkinter --exclude-module pytest app.py
      - name: Autotest del ejecutable
        shell: pwsh
        run: |
          $p = Start-Process dist\Despeja\Despeja.exe -ArgumentList "--autotest", "$env:RUNNER_TEMP\at.txt" -Wait -PassThru
          Get-Content "$env:RUNNER_TEMP\at.txt"
          if ((Get-Content "$env:RUNNER_TEMP\at.txt" -First 1) -ne "OK") { exit 1 }
      - name: ZIP, SHA-256 y notas
        shell: pwsh
        run: |
          Compress-Archive -Path dist\Despeja -DestinationPath Despeja-Windows.zip
          Get-FileHash -Algorithm SHA256 Despeja-Windows.zip, dist\Despeja\Despeja.exe |
            ForEach-Object { $_.Hash.ToLower() + "  " + (Split-Path $_.Path -Leaf) } | Set-Content SHA256SUMS.txt
          $v = "${{ needs.version.outputs.version }}"
          $cl = Get-Content CHANGELOG.md -Raw
          $m = [regex]::Match($cl, "(?ms)^## $([regex]::Escape($v))[^\n]*\n(.*?)(?=^## |\z)")
          $hashes = (Get-Content SHA256SUMS.txt) -join "`n"
          $f = '```'
          $notas = $m.Groups[1].Value.Trim() + "`n`n**SHA-256**`n" + $f + "`n" + $hashes + "`n" + $f + "`n`nWindows 10/11 · Requiere Microsoft Edge WebView2 Runtime (incluido en Windows 11)."
          Set-Content -Encoding utf8 NOTAS.md $notas
          Get-Content NOTAS.md
      - name: Publicar
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Despeja ${{ needs.version.outputs.version }}
          body_path: NOTAS.md
          files: |
            Despeja-Windows.zip
            SHA256SUMS.txt
